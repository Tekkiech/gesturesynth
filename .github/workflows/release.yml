name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # No paid Apple Developer account in the loop, so this is ad-hoc signed
      # rather than Developer-ID signed + notarized. It runs fine, but macOS
      # will flag it as "from an unidentified developer" on first launch since
      # it's a downloaded, quarantined file -- right-click > Open bypasses that.
      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -project GestureSynth.xcodeproj -scheme GestureSynth -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package DMG
        run: |
          APP_PATH="build/Build/Products/Release/GestureSynth.app"
          STAGING="dmg-staging"
          rm -rf "$STAGING" GestureSynth.dmg
          mkdir "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "GestureSynth" -srcfolder "$STAGING" -ov -format UDZO GestureSynth.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: GestureSynth-dmg
          path: GestureSynth.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" GestureSynth.dmg \
            --title "${{ github.ref_name }}" \
            --generate-notes
